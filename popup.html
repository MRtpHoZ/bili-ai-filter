<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>清流</h1>
    <label class="switch" title="总开关">
      <input type="checkbox" id="master">
      <span class="slider"></span>
    </label>
  </header>

  <section>
    <h2>内容标注类型</h2>
    <div id="types"></div>
  </section>

  <section>
    <h2>关键字过滤</h2>
    <textarea id="keywords" placeholder="一行一个关键字，命中标题或描述即过滤"></textarea>
  </section>

  <section>
    <h2>隐藏方式</h2>
    <div id="mode">
      <label><input type="radio" name="mode" value="placeholder"> 占位（原地留灰块，排版不变）</label>
      <label><input type="radio" name="mode" value="reflow"> 补位（后面视频顶上来，默认）</label>
    </div>
  </section>

  <footer id="count">本页已过滤 — 个视频</footer>

  <script src="core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
